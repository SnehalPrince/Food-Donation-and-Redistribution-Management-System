name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-ci:
    name: Ubuntu | ${{ matrix.compiler }} | ${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [c++11, c++17]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Toolchain
        run: |
          ${{ matrix.compiler }} --version
          make --version

      - name: Compile & Run All Tests
        run: |
          make clean
          make CXX=${{ matrix.compiler }} STD=${{ matrix.std }} all test

      - name: Run Viva Demo Scenario
        run: |
          make CXX=${{ matrix.compiler }} STD=${{ matrix.std }} demo

  windows-ci:
    name: Windows | MinGW | ${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [c++11, c++17]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MinGW via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Add MinGW to Windows PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Toolchain
        shell: cmd
        run: |
          g++ --version
          mingw32-make --version

      - name: Compile & Run All Tests
        shell: cmd
        run: |
          mingw32-make clean
          mingw32-make STD=${{ matrix.std }} all test

      - name: Run Viva Demo Scenario
        shell: cmd
        run: |
          mingw32-make STD=${{ matrix.std }} demo
